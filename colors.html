<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors — CLOTHERP Clothing Management Platform</title>
    <meta name="description" content="Manage fabric and apparel color swatches for CLOTHERP.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#0f172a',
                            900: '#090d16',
                            950: '#05070d'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-[#090D16] text-slate-100 antialiased selection:bg-blue-600 selection:text-white bg-grid-pattern overflow-x-hidden min-h-screen">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR MOUNT -->
        <div id="sidebarMount"></div>

        <!-- MAIN APPLICATION WORKSPACE -->
        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            <!-- TOPBAR MOUNT -->
            <div id="topbarMount"></div>

            <!-- MAIN CONTENT AREA -->
            <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl w-full mx-auto">
                
                <!-- Page Header -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs text-slate-400 font-mono uppercase tracking-wider">Product Master</span>
                            <span class="text-slate-600">/</span>
                            <span class="text-xs text-blue-400 font-bold font-mono">Palette</span>
                        </div>
                        <h1 class="text-2xl font-extrabold text-white mt-1">Fabric Colors</h1>
                        <p class="text-xs text-slate-400">Define color master swatches used for apparel variant generation and barcode labeling.</p>
                    </div>

                    <div id="actionBtnArea">
                        <button id="btnOpenAddColor" class="btn-primary px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow-lg shadow-blue-500/20 transition flex items-center space-x-2">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>Add Color</span>
                        </button>
                    </div>
                </div>

                <!-- Table Filter & Search Controls -->
                <div class="glass-card p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div class="relative w-full sm:w-80">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </div>
                        <input 
                            type="text" 
                            id="colorSearchInput" 
                            placeholder="Search color name or hex code..." 
                            class="w-full pl-10 pr-3.5 py-2 bg-slate-950/70 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40"
                        >
                    </div>

                    <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                        <select id="statusFilter" class="px-3 py-2 bg-slate-950/70 border border-slate-700 rounded-xl text-xs text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                            <option value="">All Statuses</option>
                            <option value="Active">Active Only</option>
                            <option value="Inactive">Inactive Only</option>
                        </select>
                    </div>
                </div>

                <!-- Colors Table Card -->
                <div class="glass-card rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead>
                                <tr class="bg-slate-950/70 text-slate-400 border-b border-slate-800 uppercase font-mono text-[11px]">
                                    <th class="py-3 px-4">Color Swatch</th>
                                    <th class="py-3 px-4">Color Name</th>
                                    <th class="py-3 px-4">Hex Code</th>
                                    <th class="py-3 px-3 text-center">Status</th>
                                    <th class="py-3 px-4 text-center">Created On</th>
                                    <th class="py-3 px-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="colorTableBody" class="divide-y divide-slate-800/60">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination Footer -->
                    <div class="p-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400" id="paginationFooter">
                        <span id="showingCount">Showing 0 of 0 colors</span>
                        <div class="flex items-center space-x-2">
                            <button id="btnPrevPage" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 disabled:opacity-40 transition">Previous</button>
                            <span id="pageInfo" class="font-mono text-slate-200">Page 1 of 1</span>
                            <button id="btnNextPage" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 disabled:opacity-40 transition">Next</button>
                        </div>
                    </div>
                </div>

            </main>

            <!-- Footer -->
            <footer class="py-4 px-6 border-t border-slate-800/80 bg-slate-950/60 text-xs text-slate-500 flex justify-between items-center">
                <div>© 2026 CLOTHERP. All rights reserved.</div>
                <div class="font-mono text-[11px] text-slate-600">Product Masters • Colors</div>
            </footer>

        </div>
    </div>

    <!-- ADD / EDIT COLOR MODAL -->
    <div id="colorModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="relative w-full max-w-md rounded-2xl bg-slate-900 border border-slate-700 p-6 shadow-2xl space-y-4 transform scale-95 transition-transform duration-200" id="colorModalCard">
            
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
                        <i data-lucide="palette" class="w-4 h-4"></i>
                    </div>
                    <h3 class="text-sm font-bold text-white" id="modalTitle">Add New Color</h3>
                </div>
                <button id="btnCloseModal" class="p-1 rounded-lg text-slate-400 hover:text-white transition">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <form id="colorForm" class="space-y-3.5" novalidate>
                <input type="hidden" id="colorId">

                <div class="space-y-1">
                    <label for="colorName" class="block text-xs font-semibold text-slate-300">Color Name <span class="text-red-400">*</span></label>
                    <input type="text" id="colorName" placeholder="e.g. Navy Blue" class="w-full px-3.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                    <div id="colorNameError" class="hidden text-[11px] text-red-400 font-medium pt-0.5"></div>
                </div>

                <!-- Hex & Picker Sync Group -->
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-300">Color Swatch & Hex Code</label>
                    <div class="flex items-center space-x-3">
                        <input type="color" id="colorPickerInput" value="#1E3A8A" class="w-10 h-10 rounded-xl bg-slate-950 border border-slate-700 cursor-pointer p-0.5">
                        <div class="flex-1 relative">
                            <input type="text" id="colorHexText" value="#1E3A8A" placeholder="#000000" maxlength="7" class="w-full px-3.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white font-mono uppercase placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                        </div>
                    </div>
                    <div id="colorHexError" class="hidden text-[11px] text-red-400 font-medium pt-0.5"></div>
                </div>

                <div class="space-y-1">
                    <label for="colorStatus" class="block text-xs font-semibold text-slate-300">Status</label>
                    <select id="colorStatus" class="w-full px-3.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-800">
                    <button type="button" id="btnCancelModal" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">Cancel</button>
                    <button type="submit" id="btnSaveColor" class="btn-primary px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow transition">Save Color</button>
                </div>
            </form>

        </div>
    </div>

    <!-- Script Handling -->
    <script type="module">
        import { requireAuth } from './assets/js/utils/authGuard.js';
        import { authService } from './assets/js/services/authService.js';
        import { colorService } from './assets/js/services/colorService.js';
        import { initSidebar } from './assets/js/components/sidebar.js';
        import { initTopbar } from './assets/js/components/topbar.js';
        import { PERMISSIONS } from './assets/js/config/permissions.js';

        const user = requireAuth();
        if (!user) throw new Error('Auth required');

        const canManage = authService.hasPermission(PERMISSIONS.MASTERS_MANAGE);

        let allColors = [];
        let filteredColors = [];
        let currentPage = 1;
        const pageSize = 8;

        document.addEventListener('DOMContentLoaded', async () => {
            initSidebar('sidebarMount', 'colors');
            initTopbar('topbarMount');

            if (!canManage) {
                const addBtn = document.getElementById('btnOpenAddColor');
                if (addBtn) addBtn.style.display = 'none';
            }

            if (window.lucide) lucide.createIcons();

            await loadColors();
            attachEvents();
        });

        async function loadColors() {
            allColors = await colorService.getColors();
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('colorSearchInput').value.trim().toLowerCase();
            const status = document.getElementById('statusFilter').value;

            filteredColors = allColors.filter(c => {
                const nameMatch = c.name.toLowerCase().includes(query) || c.hexCode.toLowerCase().includes(query);
                const statusMatch = !status || c.status === status;
                return nameMatch && statusMatch;
            });

            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('colorTableBody');
            const start = (currentPage - 1) * pageSize;
            const paginated = filteredColors.slice(start, start + pageSize);
            const totalPages = Math.ceil(filteredColors.length / pageSize) || 1;

            document.getElementById('showingCount').textContent = `Showing ${paginated.length} of ${filteredColors.length} colors`;
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('btnPrevPage').disabled = currentPage <= 1;
            document.getElementById('btnNextPage').disabled = currentPage >= totalPages;

            if (paginated.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="py-8 text-center text-slate-500">
                            <div class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center mx-auto mb-2 text-slate-600">
                                <i data-lucide="palette" class="w-5 h-5"></i>
                            </div>
                            No colors found matching your criteria.
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = paginated.map(c => `
                    <tr class="border-b border-slate-800/60 hover:bg-slate-850/50 transition">
                        <td class="py-3 px-4">
                            <div class="flex items-center space-x-2">
                                <span class="w-6 h-6 rounded-full border border-slate-700 shadow inline-block" style="background-color: ${c.hexCode};"></span>
                            </div>
                        </td>
                        <td class="py-3 px-4">
                            <div class="font-bold text-slate-200">${c.name}</div>
                        </td>
                        <td class="py-3 px-4 font-mono text-slate-300">${c.hexCode}</td>
                        <td class="py-3 px-3 text-center">
                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border ${
                                c.status === 'Active' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-slate-800 text-slate-400 border-slate-700'
                            }">
                                ${c.status}
                            </span>
                        </td>
                        <td class="py-3 px-4 text-center font-mono text-slate-400">${c.createdOn}</td>
                        <td class="py-3 px-4 text-right">
                            ${canManage ? `
                                <div class="flex items-center justify-end space-x-2">
                                    <button class="btn-edit-color p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition" data-id="${c.id}" title="Edit Color">
                                        <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button class="btn-toggle-color p-1.5 rounded-lg ${
                                        c.status === 'Active' ? 'text-amber-400 hover:text-amber-300 hover:bg-amber-500/10' : 'text-emerald-400 hover:text-emerald-300 hover:bg-emerald-500/10'
                                    } transition" data-id="${c.id}" title="${c.status === 'Active' ? 'Deactivate' : 'Activate'}">
                                        <i data-lucide="${c.status === 'Active' ? 'slash' : 'check'}" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            ` : `
                                <span class="text-[10px] text-slate-600 font-mono">View Only</span>
                            `}
                        </td>
                    </tr>
                `).join('');
            }

            if (window.lucide) lucide.createIcons();

            attachRowActions();
        }

        function attachRowActions() {
            document.querySelectorAll('.btn-edit-color').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.getAttribute('data-id');
                    const target = allColors.find(c => c.id === id);
                    if (target) openModal(target);
                });
            });

            document.querySelectorAll('.btn-toggle-color').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.getAttribute('data-id');
                    await colorService.toggleStatus(id);
                    await loadColors();
                });
            });
        }

        function attachEvents() {
            document.getElementById('colorSearchInput').addEventListener('input', applyFilters);
            document.getElementById('statusFilter').addEventListener('change', applyFilters);

            // Sync Color Picker and Hex Text
            const picker = document.getElementById('colorPickerInput');
            const hexText = document.getElementById('colorHexText');

            picker.addEventListener('input', () => {
                hexText.value = picker.value.toUpperCase();
            });

            hexText.addEventListener('input', () => {
                let val = hexText.value.trim();
                if (!val.startsWith('#')) val = '#' + val;
                if (/^#[0-9A-F]{6}$/i.test(val)) {
                    picker.value = val;
                }
            });

            document.getElementById('btnPrevPage').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderTable();
                }
            });

            document.getElementById('btnNextPage').addEventListener('click', () => {
                const totalPages = Math.ceil(filteredColors.length / pageSize);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTable();
                }
            });

            const openBtn = document.getElementById('btnOpenAddColor');
            if (openBtn) {
                openBtn.addEventListener('click', () => openModal());
            }

            document.getElementById('btnCloseModal').addEventListener('click', closeModal);
            document.getElementById('btnCancelModal').addEventListener('click', closeModal);

            document.getElementById('colorForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('colorId').value;
                const name = document.getElementById('colorName').value.trim();
                let hex = document.getElementById('colorHexText').value.trim();
                const status = document.getElementById('colorStatus').value;
                const errEl = document.getElementById('colorNameError');
                const hexErrEl = document.getElementById('colorHexError');

                if (!name) {
                    errEl.textContent = 'Color name is required.';
                    errEl.classList.remove('hidden');
                    return;
                }
                errEl.classList.add('hidden');

                if (!hex.startsWith('#')) hex = '#' + hex;
                if (!/^#[0-9A-F]{6}$/i.test(hex)) {
                    hexErrEl.textContent = 'Enter a valid 6-digit hex code (e.g. #1E3A8A).';
                    hexErrEl.classList.remove('hidden');
                    return;
                }
                hexErrEl.classList.add('hidden');

                if (id) {
                    const res = await colorService.updateColor(id, { name, hexCode: hex.toUpperCase(), status });
                    if (!res.success) {
                        errEl.textContent = res.message;
                        errEl.classList.remove('hidden');
                        return;
                    }
                } else {
                    const res = await colorService.createColor({ name, hexCode: hex.toUpperCase(), status });
                    if (!res.success) {
                        errEl.textContent = res.message;
                        errEl.classList.remove('hidden');
                        return;
                    }
                }

                closeModal();
                await loadColors();
            });
        }

        function openModal(color = null) {
            const modal = document.getElementById('colorModal');
            const card = document.getElementById('colorModalCard');
            const title = document.getElementById('modalTitle');
            const idInput = document.getElementById('colorId');
            const nameInput = document.getElementById('colorName');
            const picker = document.getElementById('colorPickerInput');
            const hexText = document.getElementById('colorHexText');
            const statusInput = document.getElementById('colorStatus');
            const errEl = document.getElementById('colorNameError');
            const hexErrEl = document.getElementById('colorHexError');

            errEl.classList.add('hidden');
            hexErrEl.classList.add('hidden');

            if (color) {
                title.textContent = 'Edit Color';
                idInput.value = color.id;
                nameInput.value = color.name;
                picker.value = color.hexCode;
                hexText.value = color.hexCode;
                statusInput.value = color.status;
            } else {
                title.textContent = 'Add New Color';
                idInput.value = '';
                nameInput.value = '';
                picker.value = '#1E3A8A';
                hexText.value = '#1E3A8A';
                statusInput.value = 'Active';
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
                nameInput.focus();
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('colorModal');
            const card = document.getElementById('colorModalCard');
            modal.classList.add('opacity-0');
            card.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }
    </script>
</body>
</html>
