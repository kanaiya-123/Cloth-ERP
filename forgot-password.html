<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — CLOTHERP Clothing Management ERP</title>
    <meta name="description" content="Reset your CLOTHERP account password.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#0f172a',
                            900: '#090d16',
                            950: '#05070d'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-[#090D16] text-slate-100 antialiased selection:bg-blue-600 selection:text-white bg-grid-pattern min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="py-4 px-6 border-b border-slate-800/80 bg-slate-950/60 backdrop-blur-md">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="./index.html" class="flex items-center space-x-3 group">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20 group-hover:scale-105 transition-transform duration-200">
                    <i data-lucide="layers" class="w-4 h-4 text-white"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-lg font-extrabold tracking-wider text-white font-mono">CLOTH<span class="text-blue-400">ERP</span></span>
                    <span class="text-[8px] uppercase tracking-widest text-slate-400 -mt-1 font-semibold">Clothing ERP</span>
                </div>
            </a>

            <a href="./login.html" class="text-xs font-semibold text-slate-400 hover:text-white flex items-center space-x-1.5 transition">
                <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                <span>Back to Login</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6">
        <div class="w-full max-w-md p-6 sm:p-8 rounded-3xl bg-slate-900/90 border border-slate-800 shadow-2xl shadow-black/80 space-y-6">
            
            <div class="w-12 h-12 rounded-2xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center mx-auto">
                <i data-lucide="key-round" class="w-6 h-6"></i>
            </div>

            <div class="text-center space-y-1.5">
                <h1 class="text-2xl font-extrabold text-white">Forgot your password?</h1>
                <p class="text-xs text-slate-400">Enter your email address and we'll help you reset your password.</p>
            </div>

            <!-- Feedback Container -->
            <div id="forgotFeedback" class="hidden p-3.5 rounded-xl text-xs flex items-start space-x-2.5 border transition-all"></div>

            <form id="forgotForm" class="space-y-4" novalidate>
                <div class="space-y-1.5">
                    <label for="email" class="block text-xs font-semibold text-slate-300">
                        Work Email Address <span class="text-red-400">*</span>
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </div>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            autocomplete="email"
                            placeholder="name@company.com"
                            class="w-full pl-10 pr-3.5 py-2.5 bg-slate-950/70 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 transition"
                        >
                    </div>
                    <div id="emailError" class="hidden text-[11px] text-red-400 font-medium pt-0.5"></div>
                </div>

                <button 
                    type="submit" 
                    id="submitBtn" 
                    class="btn-primary w-full py-3 px-4 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold text-sm shadow-xl shadow-blue-600/25 flex items-center justify-center space-x-2 transition-all"
                >
                    <span id="btnText">Send Reset Link</span>
                    <i data-lucide="send" id="btnIcon" class="w-4 h-4"></i>
                </button>
            </form>

            <div class="pt-4 border-t border-slate-800 text-center text-xs text-slate-400">
                Remember your password? <a href="./login.html" class="text-blue-400 hover:underline font-semibold">Sign in here</a>
            </div>

            <!-- Demo Simulation Link (For Review Ease) -->
            <div class="text-center">
                <a href="./reset-password.html" class="text-[11px] text-slate-500 hover:text-slate-400 underline">
                    (Demo Mode: Directly simulate Reset Password page)
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-xs text-slate-500 border-t border-slate-800/80 bg-slate-950/40">
        © 2026 CLOTHERP. All rights reserved.
    </footer>

    <!-- Script Handling -->
    <script type="module">
        import { authService } from './assets/js/services/authService.js';

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();

            const form = document.getElementById('forgotForm');
            const emailInput = document.getElementById('email');
            const emailError = document.getElementById('emailError');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnIcon = document.getElementById('btnIcon');
            const feedbackEl = document.getElementById('forgotFeedback');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                emailError.classList.add('hidden');
                emailInput.classList.remove('border-red-500');

                const email = emailInput.value.trim();

                if (!email) {
                    emailError.textContent = 'Email address is required.';
                    emailError.classList.remove('hidden');
                    emailInput.classList.add('border-red-500');
                    return;
                }

                // Simple email pattern check
                if (!email.includes('@') || !email.includes('.')) {
                    emailError.textContent = 'Please enter a valid email address.';
                    emailError.classList.remove('hidden');
                    emailInput.classList.add('border-red-500');
                    return;
                }

                // Submit simulation
                submitBtn.disabled = true;
                btnText.textContent = 'Sending...';
                btnIcon.setAttribute('data-lucide', 'loader-2');
                btnIcon.classList.add('animate-spin');
                if (window.lucide) lucide.createIcons();

                const res = await authService.requestPasswordReset(email);

                feedbackEl.classList.remove('hidden');
                feedbackEl.className = 'p-3.5 rounded-xl text-xs flex items-start space-x-2.5 border bg-blue-500/10 border-blue-500/30 text-blue-300';
                feedbackEl.innerHTML = `
                    <i data-lucide="info" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
                    <div>
                        <div class="font-bold mb-0.5">Password Reset Requested</div>
                        <div>${res.message}</div>
                        <div class="mt-2 text-[11px] text-slate-400">
                            For testing purposes, proceed to <a href="./reset-password.html" class="text-blue-400 underline font-semibold">Reset Password Screen →</a>
                        </div>
                    </div>
                `;
                if (window.lucide) lucide.createIcons();

                submitBtn.disabled = false;
                btnText.textContent = 'Resend Reset Link';
                btnIcon.setAttribute('data-lucide', 'send');
                btnIcon.classList.remove('animate-spin');
                if (window.lucide) lucide.createIcons();
            });
        });
    </script>
</body>
</html>
