<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brands — CLOTHERP Clothing Management Platform</title>
    <meta name="description" content="Manage apparel brand labels for CLOTHERP.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#0f172a',
                            900: '#090d16',
                            950: '#05070d'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-[#090D16] text-slate-100 antialiased selection:bg-blue-600 selection:text-white bg-grid-pattern overflow-x-hidden min-h-screen">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR MOUNT -->
        <div id="sidebarMount"></div>

        <!-- MAIN APPLICATION WORKSPACE -->
        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            <!-- TOPBAR MOUNT -->
            <div id="topbarMount"></div>

            <!-- MAIN CONTENT AREA -->
            <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl w-full mx-auto">
                
                <!-- Page Header -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2">
                    <div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs text-slate-400 font-mono uppercase tracking-wider">Product Master</span>
                            <span class="text-slate-600">/</span>
                            <span class="text-xs text-blue-400 font-bold font-mono">Labels</span>
                        </div>
                        <h1 class="text-2xl font-extrabold text-white mt-1">Apparel Brands</h1>
                        <p class="text-xs text-slate-400">Manage internal fashion labels and external manufacturer brands.</p>
                    </div>

                    <div id="actionBtnArea">
                        <button id="btnOpenAddBrand" class="btn-primary px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow-lg shadow-blue-500/20 transition flex items-center space-x-2">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>Add Brand</span>
                        </button>
                    </div>
                </div>

                <!-- Table Filter & Search Controls -->
                <div class="glass-card p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row items-center justify-between gap-3">
                    <div class="relative w-full sm:w-80">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </div>
                        <input 
                            type="text" 
                            id="brandSearchInput" 
                            placeholder="Search brands..." 
                            class="w-full pl-10 pr-3.5 py-2 bg-slate-950/70 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40"
                        >
                    </div>

                    <div class="flex items-center space-x-2 w-full sm:w-auto justify-end">
                        <select id="statusFilter" class="px-3 py-2 bg-slate-950/70 border border-slate-700 rounded-xl text-xs text-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                            <option value="">All Statuses</option>
                            <option value="Active">Active Only</option>
                            <option value="Inactive">Inactive Only</option>
                        </select>
                    </div>
                </div>

                <!-- Brands Table Card -->
                <div class="glass-card rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead>
                                <tr class="bg-slate-950/70 text-slate-400 border-b border-slate-800 uppercase font-mono text-[11px]">
                                    <th class="py-3 px-4">Brand Label</th>
                                    <th class="py-3 px-4">Description</th>
                                    <th class="py-3 px-3 text-center">Status</th>
                                    <th class="py-3 px-4 text-center">Created On</th>
                                    <th class="py-3 px-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="brandTableBody" class="divide-y divide-slate-800/60">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>

                    <!-- Pagination Footer -->
                    <div class="p-4 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400" id="paginationFooter">
                        <span id="showingCount">Showing 0 of 0 brands</span>
                        <div class="flex items-center space-x-2">
                            <button id="btnPrevPage" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 disabled:opacity-40 transition">Previous</button>
                            <span id="pageInfo" class="font-mono text-slate-200">Page 1 of 1</span>
                            <button id="btnNextPage" class="px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-300 disabled:opacity-40 transition">Next</button>
                        </div>
                    </div>
                </div>

            </main>

            <!-- Footer -->
            <footer class="py-4 px-6 border-t border-slate-800/80 bg-slate-950/60 text-xs text-slate-500 flex justify-between items-center">
                <div>© 2026 CLOTHERP. All rights reserved.</div>
                <div class="font-mono text-[11px] text-slate-600">Product Masters • Brands</div>
            </footer>

        </div>
    </div>

    <!-- ADD / EDIT BRAND MODAL -->
    <div id="brandModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
        <div class="relative w-full max-w-md rounded-2xl bg-slate-900 border border-slate-700 p-6 shadow-2xl space-y-4 transform scale-95 transition-transform duration-200" id="brandModalCard">
            
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <div class="flex items-center space-x-2.5">
                    <div class="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center">
                        <i data-lucide="award" class="w-4 h-4"></i>
                    </div>
                    <h3 class="text-sm font-bold text-white" id="modalTitle">Add New Brand</h3>
                </div>
                <button id="btnCloseModal" class="p-1 rounded-lg text-slate-400 hover:text-white transition">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>

            <form id="brandForm" class="space-y-3.5" novalidate>
                <input type="hidden" id="brandId">

                <div class="space-y-1">
                    <label for="brandName" class="block text-xs font-semibold text-slate-300">Brand Name <span class="text-red-400">*</span></label>
                    <input type="text" id="brandName" placeholder="e.g. Loom & Thread Co." class="w-full px-3.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                    <div id="brandNameError" class="hidden text-[11px] text-red-400 font-medium pt-0.5"></div>
                </div>

                <div class="space-y-1">
                    <label for="brandDesc" class="block text-xs font-semibold text-slate-300">Description</label>
                    <textarea id="brandDesc" rows="3" placeholder="Brief details about this apparel line or vendor brand..." class="w-full px-3.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40"></textarea>
                </div>

                <div class="space-y-1">
                    <label for="brandStatus" class="block text-xs font-semibold text-slate-300">Status</label>
                    <select id="brandStatus" class="w-full px-3.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                </div>

                <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-800">
                    <button type="button" id="btnCancelModal" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">Cancel</button>
                    <button type="submit" id="btnSaveBrand" class="btn-primary px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow transition">Save Brand</button>
                </div>
            </form>

        </div>
    </div>

    <!-- Script Handling -->
    <script type="module">
        import { requireAuth } from './assets/js/utils/authGuard.js';
        import { authService } from './assets/js/services/authService.js';
        import { brandService } from './assets/js/services/brandService.js';
        import { initSidebar } from './assets/js/components/sidebar.js';
        import { initTopbar } from './assets/js/components/topbar.js';
        import { PERMISSIONS } from './assets/js/config/permissions.js';

        const user = requireAuth();
        if (!user) throw new Error('Auth required');

        const canManage = authService.hasPermission(PERMISSIONS.MASTERS_MANAGE);

        let allBrands = [];
        let filteredBrands = [];
        let currentPage = 1;
        const pageSize = 8;

        document.addEventListener('DOMContentLoaded', async () => {
            initSidebar('sidebarMount', 'brands');
            initTopbar('topbarMount');

            if (!canManage) {
                const addBtn = document.getElementById('btnOpenAddBrand');
                if (addBtn) addBtn.style.display = 'none';
            }

            if (window.lucide) lucide.createIcons();

            await loadBrands();
            attachEvents();
        });

        async function loadBrands() {
            allBrands = await brandService.getBrands();
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('brandSearchInput').value.trim().toLowerCase();
            const status = document.getElementById('statusFilter').value;

            filteredBrands = allBrands.filter(b => {
                const nameMatch = b.name.toLowerCase().includes(query) || (b.description && b.description.toLowerCase().includes(query));
                const statusMatch = !status || b.status === status;
                return nameMatch && statusMatch;
            });

            currentPage = 1;
            renderTable();
        }

        function renderTable() {
            const tbody = document.getElementById('brandTableBody');
            const start = (currentPage - 1) * pageSize;
            const paginated = filteredBrands.slice(start, start + pageSize);
            const totalPages = Math.ceil(filteredBrands.length / pageSize) || 1;

            document.getElementById('showingCount').textContent = `Showing ${paginated.length} of ${filteredBrands.length} brands`;
            document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('btnPrevPage').disabled = currentPage <= 1;
            document.getElementById('btnNextPage').disabled = currentPage >= totalPages;

            if (paginated.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="py-8 text-center text-slate-500">
                            <div class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center mx-auto mb-2 text-slate-600">
                                <i data-lucide="award" class="w-5 h-5"></i>
                            </div>
                            No brands found matching your criteria.
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML = paginated.map(b => `
                    <tr class="border-b border-slate-800/60 hover:bg-slate-850/50 transition">
                        <td class="py-3 px-4">
                            <div class="font-bold text-slate-200">${b.name}</div>
                        </td>
                        <td class="py-3 px-4 text-slate-400 max-w-xs truncate">${b.description || '—'}</td>
                        <td class="py-3 px-3 text-center">
                            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-semibold border ${
                                b.status === 'Active' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-slate-800 text-slate-400 border-slate-700'
                            }">
                                ${b.status}
                            </span>
                        </td>
                        <td class="py-3 px-4 text-center font-mono text-slate-400">${b.createdOn}</td>
                        <td class="py-3 px-4 text-right">
                            ${canManage ? `
                                <div class="flex items-center justify-end space-x-2">
                                    <button class="btn-edit-brand p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition" data-id="${b.id}" title="Edit Brand">
                                        <i data-lucide="edit-2" class="w-3.5 h-3.5"></i>
                                    </button>
                                    <button class="btn-toggle-brand p-1.5 rounded-lg ${
                                        b.status === 'Active' ? 'text-amber-400 hover:text-amber-300 hover:bg-amber-500/10' : 'text-emerald-400 hover:text-emerald-300 hover:bg-emerald-500/10'
                                    } transition" data-id="${b.id}" title="${b.status === 'Active' ? 'Deactivate' : 'Activate'}">
                                        <i data-lucide="${b.status === 'Active' ? 'slash' : 'check'}" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>
                            ` : `
                                <span class="text-[10px] text-slate-600 font-mono">View Only</span>
                            `}
                        </td>
                    </tr>
                `).join('');
            }

            if (window.lucide) lucide.createIcons();

            attachRowActions();
        }

        function attachRowActions() {
            document.querySelectorAll('.btn-edit-brand').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.getAttribute('data-id');
                    const target = allBrands.find(b => b.id === id);
                    if (target) openModal(target);
                });
            });

            document.querySelectorAll('.btn-toggle-brand').forEach(btn => {
                btn.addEventListener('click', async () => {
                    const id = btn.getAttribute('data-id');
                    await brandService.toggleStatus(id);
                    await loadBrands();
                });
            });
        }

        function attachEvents() {
            document.getElementById('brandSearchInput').addEventListener('input', applyFilters);
            document.getElementById('statusFilter').addEventListener('change', applyFilters);

            document.getElementById('btnPrevPage').addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderTable();
                }
            });

            document.getElementById('btnNextPage').addEventListener('click', () => {
                const totalPages = Math.ceil(filteredBrands.length / pageSize);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderTable();
                }
            });

            const openBtn = document.getElementById('btnOpenAddBrand');
            if (openBtn) {
                openBtn.addEventListener('click', () => openModal());
            }

            document.getElementById('btnCloseModal').addEventListener('click', closeModal);
            document.getElementById('btnCancelModal').addEventListener('click', closeModal);

            document.getElementById('brandForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const id = document.getElementById('brandId').value;
                const name = document.getElementById('brandName').value.trim();
                const desc = document.getElementById('brandDesc').value.trim();
                const status = document.getElementById('brandStatus').value;
                const errEl = document.getElementById('brandNameError');

                if (!name) {
                    errEl.textContent = 'Brand name is required.';
                    errEl.classList.remove('hidden');
                    return;
                }
                errEl.classList.add('hidden');

                if (id) {
                    const res = await brandService.updateBrand(id, { name, description: desc, status });
                    if (!res.success) {
                        errEl.textContent = res.message;
                        errEl.classList.remove('hidden');
                        return;
                    }
                } else {
                    const res = await brandService.createBrand({ name, description: desc, status });
                    if (!res.success) {
                        errEl.textContent = res.message;
                        errEl.classList.remove('hidden');
                        return;
                    }
                }

                closeModal();
                await loadBrands();
            });
        }

        function openModal(brand = null) {
            const modal = document.getElementById('brandModal');
            const card = document.getElementById('brandModalCard');
            const title = document.getElementById('modalTitle');
            const idInput = document.getElementById('brandId');
            const nameInput = document.getElementById('brandName');
            const descInput = document.getElementById('brandDesc');
            const statusInput = document.getElementById('brandStatus');
            const errEl = document.getElementById('brandNameError');

            errEl.classList.add('hidden');

            if (brand) {
                title.textContent = 'Edit Brand';
                idInput.value = brand.id;
                nameInput.value = brand.name;
                descInput.value = brand.description || '';
                statusInput.value = brand.status;
            } else {
                title.textContent = 'Add New Brand';
                idInput.value = '';
                nameInput.value = '';
                descInput.value = '';
                statusInput.value = 'Active';
            }

            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                card.classList.remove('scale-95');
                nameInput.focus();
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('brandModal');
            const card = document.getElementById('brandModalCard');
            modal.classList.add('opacity-0');
            card.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        }
    </script>
</body>
</html>
