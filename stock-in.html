<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock IN — CLOTHERP Clothing Management Platform</title>
    <meta name="description" content="Record inbound inventory receipts for apparel product variants in CLOTHERP.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#0f172a',
                            900: '#090d16',
                            950: '#05070d'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-[#090D16] text-slate-100 antialiased selection:bg-blue-600 selection:text-white bg-grid-pattern overflow-x-hidden min-h-screen">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR MOUNT -->
        <div id="sidebarMount"></div>

        <!-- MAIN APPLICATION WORKSPACE -->
        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            <!-- TOPBAR MOUNT -->
            <div id="topbarMount"></div>

            <!-- MAIN CONTENT AREA -->
            <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6 max-w-2xl w-full mx-auto">
                
                <!-- Page Header -->
                <div class="flex items-center justify-between pb-2">
                    <div>
                        <div class="flex items-center space-x-2">
                            <a href="./inventory.html" class="text-xs text-slate-400 hover:text-white transition font-mono uppercase tracking-wider">Inventory</a>
                            <span class="text-slate-600">/</span>
                            <span class="text-xs text-emerald-400 font-bold font-mono">Inbound</span>
                        </div>
                        <h1 class="text-2xl font-extrabold text-white mt-1 flex items-center space-x-2">
                            <i data-lucide="arrow-down-left" class="w-6 h-6 text-emerald-400"></i>
                            <span>Stock IN Receipt</span>
                        </h1>
                        <p class="text-xs text-slate-400">Record inbound garment stock received into the warehouse outside purchase orders.</p>
                    </div>

                    <a href="./inventory.html" class="px-3.5 py-2 rounded-xl bg-slate-900 border border-slate-700 hover:bg-slate-850 text-slate-300 text-xs font-semibold transition flex items-center space-x-1.5">
                        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
                        <span>Cancel</span>
                    </a>
                </div>

                <!-- Stock IN Form Card -->
                <div class="glass-card p-6 rounded-2xl border border-slate-800 space-y-5">
                    
                    <form id="stockInForm" class="space-y-4" novalidate>
                        
                        <!-- Product Selection -->
                        <div class="space-y-1">
                            <label for="selectProduct" class="block text-xs font-semibold text-slate-300">Select Product Style <span class="text-red-400">*</span></label>
                            <select id="selectProduct" class="w-full px-3.5 py-2 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                                <option value="">-- Choose Product --</option>
                            </select>
                            <div id="productError" class="hidden text-[11px] text-red-400 font-medium pt-0.5"></div>
                        </div>

                        <!-- Variant Selection -->
                        <div class="space-y-1">
                            <label for="selectVariant" class="block text-xs font-semibold text-slate-300">Select Variant (Color × Size) <span class="text-red-400">*</span></label>
                            <select id="selectVariant" class="w-full px-3.5 py-2 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/40" disabled>
                                <option value="">-- Select Product First --</option>
                            </select>
                            <div id="variantError" class="hidden text-[11px] text-red-400 font-medium pt-0.5"></div>
                        </div>

                        <!-- Live Stock Info Pill -->
                        <div id="variantInfoBanner" class="hidden p-3 bg-slate-950/80 rounded-xl border border-slate-800 flex items-center justify-between text-xs font-mono">
                            <div>
                                <span class="text-slate-500 block text-[10px]">SKU CODE</span>
                                <span class="font-bold text-blue-300" id="infoSku">—</span>
                            </div>
                            <div>
                                <span class="text-slate-500 block text-[10px]">CURRENT STOCK</span>
                                <span class="font-bold text-white" id="infoStock">0 Units</span>
                            </div>
                        </div>

                        <!-- Quantity and Date Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label for="inputQuantity" class="block text-xs font-semibold text-slate-300">Inbound Quantity <span class="text-red-400">*</span></label>
                                <input type="number" id="inputQuantity" min="1" placeholder="e.g. 25" class="w-full px-3.5 py-2 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-white font-mono placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                                <div id="quantityError" class="hidden text-[11px] text-red-400 font-medium pt-0.5"></div>
                            </div>

                            <div class="space-y-1">
                                <label for="inputDate" class="block text-xs font-semibold text-slate-300">Date Received <span class="text-red-400">*</span></label>
                                <input type="date" id="inputDate" class="w-full px-3.5 py-2 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                            </div>
                        </div>

                        <!-- Reference & Reason Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label for="inputReference" class="block text-xs font-semibold text-slate-300">Reference Number</label>
                                <input type="text" id="inputReference" value="REC-001" placeholder="REC-001" class="w-full px-3.5 py-2 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-white font-mono uppercase placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                            </div>

                            <div class="space-y-1">
                                <label for="selectReason" class="block text-xs font-semibold text-slate-300">Receipt Reason</label>
                                <select id="selectReason" class="w-full px-3.5 py-2 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/40">
                                    <option value="Manual Stock Received">Manual Stock Received</option>
                                    <option value="Opening Correction">Opening Correction</option>
                                    <option value="Consignment Sample">Consignment Sample</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <!-- Notes -->
                        <div class="space-y-1">
                            <label for="inputNotes" class="block text-xs font-semibold text-slate-300">Notes & Remarks</label>
                            <textarea id="inputNotes" rows="2" placeholder="Consignment intake details, delivery agent name..." class="w-full px-3.5 py-2 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/40"></textarea>
                        </div>

                        <!-- Submit Button -->
                        <div class="pt-3 border-t border-slate-800 flex justify-end space-x-2">
                            <a href="./inventory.html" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">Cancel</a>
                            <button type="submit" id="btnSubmitStockIn" class="btn-primary px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold shadow-lg shadow-emerald-500/20 transition flex items-center space-x-2">
                                <i data-lucide="check" class="w-4 h-4"></i>
                                <span>Confirm Stock IN</span>
                            </button>
                        </div>

                    </form>

                </div>

            </main>

            <!-- Footer -->
            <footer class="py-4 px-6 border-t border-slate-800/80 bg-slate-950/60 text-xs text-slate-500 flex justify-between items-center">
                <div>© 2026 CLOTHERP. All rights reserved.</div>
                <div class="font-mono text-[11px] text-slate-600">Stock IN Form</div>
            </footer>

        </div>
    </div>

    <!-- Script Handling -->
    <script type="module">
        import { requireAuth } from './assets/js/utils/authGuard.js';
        import { authService } from './assets/js/services/authService.js';
        import { inventoryService } from './assets/js/services/inventoryService.js';
        import { stockMovementService } from './assets/js/services/stockMovementService.js';
        import { productService } from './assets/js/services/productService.js';
        import { initSidebar } from './assets/js/components/sidebar.js';
        import { initTopbar } from './assets/js/components/topbar.js';
        import { PERMISSIONS } from './assets/js/config/permissions.js';

        const user = requireAuth({ requiredPermission: PERMISSIONS.INVENTORY_MANAGE });
        if (!user) throw new Error('Auth required');

        let allProducts = [];
        let allInventory = [];

        document.addEventListener('DOMContentLoaded', async () => {
            initSidebar('sidebarMount', 'inventory');
            initTopbar('topbarMount');

            if (window.lucide) lucide.createIcons();

            document.getElementById('inputDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('inputReference').value = `REC-${Math.floor(100 + Math.random() * 900)}`;

            await loadData();
            attachCascadingEvents();
        });

        async function loadData() {
            const [prodRes, invRes] = await Promise.all([
                productService.getProducts({ pageSize: 100 }),
                inventoryService.getInventory({ pageSize: 100 })
            ]);

            allProducts = prodRes.items || [];
            allInventory = invRes.items || [];

            const prodSelect = document.getElementById('selectProduct');
            prodSelect.innerHTML = '<option value="">-- Choose Product Style --</option>' +
                allProducts.map(p => `<option value="${p.id}">${p.name} (${p.code})</option>`).join('');

            // Pre-select if passed in query param
            const urlParams = new URLSearchParams(window.location.search);
            const passedVarId = urlParams.get('variantId');
            if (passedVarId) {
                const invItem = allInventory.find(i => i.productVariantId === passedVarId);
                if (invItem) {
                    prodSelect.value = invItem.productId;
                    populateVariants(invItem.productId, passedVarId);
                }
            }
        }

        function populateVariants(productId, selectedVariantId = '') {
            const varSelect = document.getElementById('selectVariant');
            const product = allProducts.find(p => p.id === productId);

            if (!product || !product.variants || product.variants.length === 0) {
                varSelect.innerHTML = '<option value="">-- No variants found for product --</option>';
                varSelect.disabled = true;
                return;
            }

            varSelect.innerHTML = '<option value="">-- Select Variant --</option>' +
                product.variants.map(v => `<option value="${v.id}" data-sku="${v.sku}">${v.color} / ${v.size} (${v.sku})</option>`).join('');

            varSelect.disabled = false;
            if (selectedVariantId) {
                varSelect.value = selectedVariantId;
                updateVariantInfoBanner(selectedVariantId);
            }
        }

        function updateVariantInfoBanner(variantId) {
            const banner = document.getElementById('variantInfoBanner');
            if (!variantId) {
                banner.classList.add('hidden');
                return;
            }

            const invItem = allInventory.find(i => i.productVariantId === variantId);
            if (invItem) {
                document.getElementById('infoSku').textContent = invItem.sku;
                document.getElementById('infoStock').textContent = `${invItem.currentStock} Units`;
                banner.classList.remove('hidden');
            }
        }

        function attachCascadingEvents() {
            document.getElementById('selectProduct').addEventListener('change', (e) => {
                populateVariants(e.target.value);
                updateVariantInfoBanner('');
            });

            document.getElementById('selectVariant').addEventListener('change', (e) => {
                updateVariantInfoBanner(e.target.value);
            });

            document.getElementById('stockInForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const productVal = document.getElementById('selectProduct').value;
                const variantVal = document.getElementById('selectVariant').value;
                const quantityVal = document.getElementById('inputQuantity').value;
                const dateVal = document.getElementById('inputDate').value;
                const refVal = document.getElementById('inputReference').value.trim();
                const reasonVal = document.getElementById('selectReason').value;
                const notesVal = document.getElementById('inputNotes').value.trim();

                const prodErr = document.getElementById('productError');
                const varErr = document.getElementById('variantError');
                const qtyErr = document.getElementById('quantityError');

                prodErr.classList.add('hidden');
                varErr.classList.add('hidden');
                qtyErr.classList.add('hidden');

                let isValid = true;
                if (!productVal) {
                    prodErr.textContent = 'Please select a product style.';
                    prodErr.classList.remove('hidden');
                    isValid = false;
                }
                if (!variantVal) {
                    varErr.textContent = 'Please select a product variant.';
                    varErr.classList.remove('hidden');
                    isValid = false;
                }
                const qty = parseInt(quantityVal);
                if (isNaN(qty) || qty <= 0) {
                    qtyErr.textContent = 'Inbound quantity must be greater than zero.';
                    qtyErr.classList.remove('hidden');
                    isValid = false;
                }

                if (!isValid) return;

                const res = await stockMovementService.recordStockIn({
                    productVariantId: variantVal,
                    quantity: qty,
                    date: dateVal,
                    referenceId: refVal,
                    reason: reasonVal,
                    notes: notesVal,
                    user: user.name
                });

                if (res.success) {
                    showToast(`Successfully added +${qty} units! New Stock: ${res.newStock}`, 'success');
                    setTimeout(() => {
                        window.location.href = `./inventory-details.html?variantId=${variantVal}`;
                    }, 500);
                } else {
                    showToast(res.message || 'Error recording Stock IN.', 'error');
                }
            });
        }

        function showToast(msg, type = 'info') {
            let toast = document.getElementById('clotherp-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'clotherp-toast';
                toast.className = 'fixed bottom-6 right-6 z-50 bg-slate-900 text-slate-100 border border-slate-700 px-4 py-3 rounded-lg shadow-2xl flex items-center space-x-3 transition-all duration-300 transform translate-y-10 opacity-0';
                toast.innerHTML = `<span id="toast-message" class="text-sm font-medium"></span>`;
                document.body.appendChild(toast);
            }
            const msgEl = document.getElementById('toast-message');
            if (msgEl) msgEl.textContent = msg;
            toast.classList.remove('translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        }
    </script>
</body>
</html>
