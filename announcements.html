<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Announcements — CLOTHERP</title>
    <meta name="description" content="Broadcast system announcements and maintenance notices across tenant organizations in CLOTHERP.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#0f172a',
                            900: '#090d16',
                            950: '#05070d'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-[#090D16] text-slate-100 antialiased selection:bg-blue-600 selection:text-white bg-grid-pattern overflow-x-hidden min-h-screen">

    <div class="flex h-screen overflow-hidden">
        
        <!-- SIDEBAR MOUNT -->
        <div id="sidebarMount"></div>

        <!-- MAIN APPLICATION WORKSPACE -->
        <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
            
            <!-- TOPBAR MOUNT -->
            <div id="topbarMount"></div>

            <!-- MAIN CONTENT AREA -->
            <main class="flex-1 p-4 sm:p-6 lg:p-8 space-y-6 max-w-7xl w-full mx-auto">
                
                <!-- Page Header & Actions -->
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-2 border-b border-slate-800">
                    <div>
                        <div class="flex items-center space-x-2">
                            <a href="./super-admin.html" class="text-xs text-slate-400 hover:text-white transition font-mono uppercase tracking-wider">Platform</a>
                            <span class="text-slate-600">/</span>
                            <span class="text-xs text-blue-400 font-bold font-mono">Announcements</span>
                        </div>
                        <h1 class="text-2xl font-extrabold text-white mt-1 flex items-center space-x-2.5">
                            <i data-lucide="megaphone" class="w-6 h-6 text-blue-400"></i>
                            <span>Platform Announcements Hub</span>
                        </h1>
                        <p class="text-xs text-slate-400">Broadcast maintenance alerts, feature releases, and critical system notifications to all tenant dashboards.</p>
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center space-x-3">
                        <button id="btnOpenAddAnnModal" class="btn-primary px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow transition flex items-center space-x-1.5">
                            <i data-lucide="plus" class="w-4 h-4"></i>
                            <span>Create Announcement</span>
                        </button>
                    </div>
                </div>

                <!-- Announcements List -->
                <div class="space-y-4" id="announcementsContainer">
                    <!-- Dynamic Cards -->
                </div>

            </main>

            <!-- Footer -->
            <footer class="py-4 px-6 border-t border-slate-800/80 bg-slate-950/60 text-xs text-slate-500 flex justify-between items-center">
                <div>© 2026 CLOTHERP. All rights reserved. • Platform Communications</div>
                <div class="font-mono text-[11px] text-slate-600">Broadcast Engine</div>
            </footer>

        </div>
    </div>

    <!-- MODAL: ADD ANNOUNCEMENT -->
    <div id="addAnnModal" class="hidden fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="glass-card max-w-md w-full rounded-2xl border border-slate-700/90 shadow-2xl p-6 space-y-4 bg-slate-900">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-sm font-bold text-white flex items-center space-x-2">
                    <i data-lucide="megaphone" class="w-4 h-4 text-blue-400"></i>
                    <span>Broadcast System Announcement</span>
                </h3>
                <button id="btnCloseAnnModal" class="text-slate-400 hover:text-white transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <form id="addAnnForm" class="space-y-3" novalidate>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Announcement Title *</label>
                    <input type="text" id="annTitleInput" required placeholder="e.g. Scheduled Cloud Maintenance" class="w-full px-3 py-2 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-white focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Message Content *</label>
                    <textarea id="annMessageInput" rows="3" required placeholder="Type broadcast message details..." class="w-full px-3 py-2 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-white focus:outline-none"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Priority</label>
                        <select id="annPrioritySelect" class="w-full px-3 py-2 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none">
                            <option value="INFO">Info</option>
                            <option value="IMPORTANT">Important</option>
                            <option value="CRITICAL">Critical Alert</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Target Audience</label>
                        <select id="annTargetSelect" class="w-full px-3 py-2 bg-slate-950/80 border border-slate-700 rounded-xl text-xs text-slate-200 focus:outline-none">
                            <option value="ALL_TENANTS">All Tenants</option>
                            <option value="ENTERPRISE_ONLY">Enterprise Only</option>
                            <option value="PRO_AND_ENTERPRISE">Pro & Enterprise</option>
                        </select>
                    </div>
                </div>

                <div class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-800">
                    <button type="button" id="btnCancelAnn" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition">Cancel</button>
                    <button type="submit" class="btn-primary px-5 py-2 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold shadow transition flex items-center space-x-1.5">
                        <i data-lucide="send" class="w-4 h-4"></i>
                        <span>Broadcast Announcement</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Handling -->
    <script type="module">
        import { requireAuth } from './assets/js/utils/authGuard.js';
        import { saasService } from './assets/js/services/saasService.js';
        import { initSidebar } from './assets/js/components/sidebar.js';
        import { initTopbar } from './assets/js/components/topbar.js';
        import { PERMISSIONS } from './assets/js/config/permissions.js';

        const user = requireAuth({ requiredPermission: PERMISSIONS.PLATFORM_ANNOUNCEMENTS_MANAGE });
        if (!user) throw new Error('Auth required');

        document.addEventListener('DOMContentLoaded', async () => {
            initSidebar('sidebarMount', 'announcements');
            initTopbar('topbarMount');

            if (window.lucide) lucide.createIcons();

            await loadAnnouncements();
            attachEvents();
        });

        async function loadAnnouncements() {
            const list = await saasService.getAnnouncements();
            const container = document.getElementById('announcementsContainer');

            container.innerHTML = list.map(a => `
                <div class="glass-card hover-lift p-5 rounded-2xl border ${
                    a.priority === 'CRITICAL' ? 'border-rose-500/40 bg-rose-950/10' :
                    a.priority === 'IMPORTANT' ? 'border-amber-500/40 bg-amber-950/10' :
                    'border-slate-800'
                } space-y-2">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center space-x-2">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${
                                a.priority === 'CRITICAL' ? 'bg-rose-500/20 text-rose-400' :
                                a.priority === 'IMPORTANT' ? 'bg-amber-500/20 text-amber-400' :
                                'bg-blue-500/20 text-blue-400'
                            }">${a.priority}</span>
                            <h3 class="text-sm font-bold text-white">${a.title}</h3>
                        </div>
                        <span class="text-[10px] text-slate-500 font-mono">${a.createdAt}</span>
                    </div>
                    <p class="text-xs text-slate-300">${a.message}</p>
                    <div class="pt-2 border-t border-slate-800/80 flex items-center justify-between text-[11px] text-slate-500 font-mono">
                        <span>Target: ${a.targetAudience}</span>
                        <span class="text-emerald-400 font-bold">Active Broadcast ✓</span>
                    </div>
                </div>
            `).join('');

            if (window.lucide) lucide.createIcons();
        }

        function attachEvents() {
            document.getElementById('btnOpenAddAnnModal').addEventListener('click', () => {
                document.getElementById('addAnnForm').reset();
                document.getElementById('addAnnModal').classList.remove('hidden');
            });
            document.getElementById('btnCloseAnnModal').addEventListener('click', () => {
                document.getElementById('addAnnModal').classList.add('hidden');
            });
            document.getElementById('btnCancelAnn').addEventListener('click', () => {
                document.getElementById('addAnnModal').classList.add('hidden');
            });

            document.getElementById('addAnnForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const annData = {
                    title: document.getElementById('annTitleInput').value,
                    message: document.getElementById('annMessageInput').value,
                    priority: document.getElementById('annPrioritySelect').value,
                    targetAudience: document.getElementById('annTargetSelect').value
                };

                const res = await saasService.createAnnouncement(annData, user.name);
                if (res.success) {
                    showToast('System announcement broadcasted to all tenant dashboards!', 'success');
                    document.getElementById('addAnnModal').classList.add('hidden');
                    await loadAnnouncements();
                }
            });
        }

        function showToast(msg, type = 'info') {
            let toast = document.getElementById('clotherp-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'clotherp-toast';
                toast.className = 'fixed bottom-6 right-6 z-50 bg-slate-900 text-slate-100 border border-slate-700 px-4 py-3 rounded-lg shadow-2xl flex items-center space-x-3 transition-all duration-300 transform translate-y-10 opacity-0';
                toast.innerHTML = `<span id="toast-message" class="text-sm font-medium"></span>`;
                document.body.appendChild(toast);
            }
            const msgEl = document.getElementById('toast-message');
            if (msgEl) msgEl.textContent = msg;
            toast.classList.remove('translate-y-10', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.add('translate-y-10', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        }
    </script>
</body>
</html>
