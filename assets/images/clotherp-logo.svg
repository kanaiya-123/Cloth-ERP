<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="500" height="120">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="foldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#3b82f6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark: Stylized Fabric Fold & ERP Hexagon -->
  <g transform="translate(15, 12)" filter="url(#glow)">
    <!-- Base Ribbon / Cloth Fold -->
    <path d="M48 6 L84 26 L84 70 L48 90 L12 70 L12 26 Z" fill="url(#logoGrad)" />
    
    <!-- Inner Textile Weave Layers -->
    <path d="M48 18 L74 33 L74 63 L48 78 L22 63 L22 33 Z" fill="#0f172a" opacity="0.85" />
    
    <!-- Fold Overlap (Collar / Fabric Loop) -->
    <path d="M48 18 L74 33 L48 48 L22 33 Z" fill="url(#foldGrad)" />
    <path d="M48 48 L74 63 L48 78 L22 63 Z" fill="url(#logoGrad)" opacity="0.9" />

    <!-- Center Sewing Needle / ERP Spark -->
    <circle cx="48" cy="48" r="4.5" fill="#38bdf8" />
  </g>

  <!-- Brand Typography -->
  <!-- CLOTH -->
  <text x="125" y="68" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#0f172a" letter-spacing="1">CLOTH</text>
  <!-- ERP in Blue Highlight -->
  <text x="300" y="68" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="44" fill="#2563eb" letter-spacing="2">ERP</text>
  
  <!-- Subtle Tagline -->
  <text x="127" y="94" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="12" fill="#64748b" letter-spacing="3.5">CLOTHING BUSINESS ERP</text>

  <!-- Small Accent Badge -->
  <rect x="420" y="38" width="55" height="18" rx="5" fill="#2563eb" opacity="0.12" />
  <text x="447" y="51" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="9" fill="#2563eb" text-anchor="middle" letter-spacing="0.5">INDIA</text>
</svg>
